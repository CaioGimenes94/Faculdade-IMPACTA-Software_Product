<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Bitntime{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<!-- CÓDIGO SUGERIDO (HTML): Adicionando o botão de retorno global no base.html -->
<body>
    
    <main class="container">

        <!-- CABEÇALHO: Marca e Botão Sair alinhados lado a lado -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-xl);">
            <p class="brand" style="margin: 0;">
                <a href="{{ url_for('inicio') }}" class="btn-voltar">Bitntime</a>                     
            </p>
        </div>

        <!-- CONTEÚDO DINÂMICO DA PÁGINA -->
        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
