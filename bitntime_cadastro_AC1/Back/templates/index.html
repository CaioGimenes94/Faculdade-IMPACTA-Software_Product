<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitntime - Cadastro de Usuário</title>
    
    <!-- CSS Básico Embutido -->
    <style>
        /* Estilos gerais para a página */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }


        /* Container principal para centralizar o formulário */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 24px;
        }

        /* Organização dos grupos de campos */
        .form-group {
            margin-bottom: 15px;
        }

        /* Estilo dos rótulos (labels) */
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Estilo comum para os campos de texto, data e seleção */
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura total */
        }

        /* Ajuste específico para o grupo de botões de rádio (Gênero) */
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
            display: inline;
        }

        /* Estilo do botão de envio */
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2980b9;
        }
        /* Feedback visual dos campos */
        input:invalid:not(:placeholder-shown) {
        border-color: #e74c3c;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px; 
            border: 1px solid #dcdfe6;
            border-radius: 6px; 
            box-sizing: border-box;
            font-size: 14px; 
            color: #2c3e50;
            background-color: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* Campo de data: não fica vermelho enquanto estiver vazio */
        input[type="date"]:invalid {
        border-color: #dcdfe6;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none; 
            border-color: #3498db; 
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        
        input::placeholder {
            color: #a0aec0;
        }
        .brand {
            text-align: center;
            text-transform: uppercase;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #3498db;
            margin: 0 0 4px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="brand">Bitntime</p>
        <h1>Cadastro de Usuário</h1>
        

        <form action="/api/usuarios" method="POST">
            
            <!-- Campo Nome -->
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
            </div>

            <!-- Campo CPF -->
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required pattern="\d{11}" maxlength="11" placeholder="Somente números (11 dígitos)" title="Digite apenas os 11 números do CPF">
                <small class="helper-text">Digite apenas os 11 dígitos, sem pontos ou hífen.</small>
            </div>

            <!-- Campo E-mail -->
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
            </div>

            <!-- Campo Data de Nascimento -->
            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required>
            </div>

            <!-- Campo Gênero -->

            <div class="form-group">
                <label>Gênero</label>
                <div class="radio-group">
                    <label><input type="radio" name="genero" value="F" required> Feminino</label>
                    <label><input type="radio" name="genero" value="M" required> Masculino</label>
                    <label><input type="radio" name="genero" value="O" required> Outro</label>
                </div>
            </div>

            <!-- Campo UF -->
            <div class="form-group">
                <label for="uf">Estado (UF)</label>
                <select id="uf" name="uf" required>
                    <option value="">Selecione um estado...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>

            <!-- Botão de Envio -->
            <button type="submit">Cadastrar</button>
            
        </form>
    </div>

</body>
</html>>
